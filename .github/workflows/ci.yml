name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # Chaque système va au bout, même si un autre échoue.
      fail-fast: false
      matrix:
        # Ubuntu 24.04 : ONNX Runtime précompilé exige glibc ≥ 2.38.
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --locked

      # Le binaire démarre, indexe et cherche vraiment sur chaque système (BM25, sans modèle).
      - name: Smoke test
        shell: bash
        run: |
          cargo run --locked -- --version
          cargo run --locked -- --root . index --no-embed
          cargo run --locked -- --root . search "split identifiers into subwords" --mode bm25 -n 2
          cargo run --locked -- --root . def rrf
