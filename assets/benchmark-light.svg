<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="Time to first answer on 13 real client tickets: 31.5 s on average with lcs versus 43.4 s for Opus 5.5 alone (−27%), faster on 11 of 13 tickets.">
<title>Time to first answer on 13 real client tickets: 31.5 s on average with lcs versus 43.4 s for Opus 5.5 alone (−27%), faster on 11 of 13 tickets.</title>
<rect width="760" height="460" rx="10" fill="#fcfcfb"/>
<text x="32.0" y="38.0" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">Time to first answer on 13 real client tickets</text>
<text x="32.0" y="58.0" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Opus 5.5 · fresh Claude Code session per ticket · lower is better</text>
<text x="32.0" y="106.0" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Time to first answer</text>
<text x="28" y="166" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><tspan font-size="60" font-weight="600" fill="#0b0b0b">27%</tspan><tspan dx="8" font-size="22" font-weight="500" fill="#52514e">shorter</tspan></text>
<text x="32.0" y="192.0" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">43.4 s → 31.5 s on average with lcs</text>
